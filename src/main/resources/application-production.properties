spring.application.name=whatsapp-chat-clone

# H2 Database Configuration for Production
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# JPA Configuration (reduced logging for production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Logging Configuration
logging.level.com.example.whatsapp_chat_clone=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# WebSocket Configuration
spring.websocket.sockjs.enabled=true
